name: 26SS to 26FW season map recrawl

on:
  schedule:
    # 2026-09-18 10:00 JST = 01:00 UTC
    - cron: '0 1 18 9 *'
  workflow_dispatch:

jobs:
  recrawl-fw:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Recrawl 26FW mapped products
        env:
          RENDER_APP_URL: https://mi-business-online.onrender.com
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET}" ]; then
            echo "Error: CRON_SECRET is not set in GitHub Actions secrets"
            exit 1
          fi

          URL="${RENDER_APP_URL}/api/cron/crawl-season-map"
          attempt=1
          max_attempts=3
          while [ "${attempt}" -le "${max_attempts}" ]; do
            echo "Attempt ${attempt}/${max_attempts}: POST ${URL}"
            HTTP_STATUS=$(curl -sS -o response.json -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "${URL}")
            echo "HTTP Status: ${HTTP_STATUS}"
            cat response.json
            echo ""
            if [ "${HTTP_STATUS}" = "200" ]; then
              SUCCESS=$(python3 -c "import json; print(json.load(open('response.json')).get('success', False))")
              if [ "${SUCCESS}" = "True" ]; then
                echo "Season map crawl triggered"
                break
              fi
              echo "Error: response success is not true"
              exit 1
            fi
            if [ "${HTTP_STATUS}" = "502" ] || [ "${HTTP_STATUS}" = "503" ]; then
              if [ "${attempt}" -lt "${max_attempts}" ]; then
                echo "Render may be waking up; retrying in 30s..."
                sleep 30
                attempt=$((attempt + 1))
                continue
              fi
            fi
            echo "Error: request failed with HTTP ${HTTP_STATUS}"
            exit 1
          done

          for i in $(seq 1 24); do
            sleep 15
            curl -sS "${RENDER_APP_URL}/api/crawl/products/status" -o status.json
            STATUS=$(python3 -c "import json; log=json.load(open('status.json')).get('log') or {}; print(log.get('status') or '')")
            CRAWL_TYPE=$(python3 -c "import json; log=json.load(open('status.json')).get('log') or {}; print(log.get('crawl_type') or '')")
            python3 -c "import json; log=json.load(open('status.json')).get('log') or {}; print('success=%s errors=%s' % (log.get('success_count'), log.get('error_count')))"
            if [ "${CRAWL_TYPE}" = "season-map" ] && [ "${STATUS}" = "completed" ]; then
              echo "Season map crawl completed"
              break
            fi
            if [ "${STATUS}" = "failed" ]; then
              echo "Season map crawl failed"
              exit 1
            fi
            if [ "${i}" = "24" ]; then
              echo "Timed out waiting for season-map crawl to finish"
              exit 1
            fi
          done

      - name: Verify mapped product API
        env:
          RENDER_APP_URL: https://mi-business-online.onrender.com
        run: |
          python3 <<'PY'
          import json
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          base = "https://mi-business-online.onrender.com/api/products"
          cutover = datetime(2026, 9, 18, 1, 0, tzinfo=timezone.utc)
          now = datetime.now(timezone.utc)

          def fetch(codes):
              query = "&".join("product_code[]=" + urllib.parse.quote(code) for code in codes)
              with urllib.request.urlopen(base + "?" + query) as response:
                  payload = json.load(response)
              by_requested = {}
              for item in payload.get("data") or []:
                  key = item.get("requested_product_code") or item.get("product_code")
                  by_requested[key] = item
              return by_requested

          def availability(item):
              return str((item or {}).get("availability") or "")

          def fail(message):
              raise SystemExit(message)

          fw_codes = [
              "gR600-303F26",
              "gR674-413F26",
              "gR679-173F26",
              "gR679-293F26",
          ]
          fw = fetch(fw_codes)
          for code in fw_codes:
              item = fw.get(code)
              if not item:
                  fail(f"{code} is missing from the product API")
              if not (item.get("product_name") or "").strip():
                  fail(f"{code} has an empty name")
              if "F26" not in (item.get("product_url") or ""):
                  fail(f"{code} URL is not FW: {item.get('product_url')}")
              if "販売終了" in availability(item) or "販売を終了" in availability(item):
                  fail(f"{code} is still marked discontinued: {availability(item)}")
              print(f"OK FW {code} name={item.get('product_name')} avail={availability(item)!r} url={item.get('product_url')}")

          if now < cutover:
              print(f"Cutover is at {cutover.isoformat()}; skipping SS alias checks at {now.isoformat()}")
              raise SystemExit(0)

          aliases = {
              "gR600-303S26": "F26",
              "gR672-503S26": "R672-503F26",
              "gR665-783S26": "R665-783F26",
              "M674-413S26": "R674-413F26",
              "M679-173S26": "R679-173F26",
              "M679-293S26": "R679-293F26",
          }
          ss = fetch(list(aliases))
          for code, needle in aliases.items():
              item = ss.get(code)
              if not item:
                  fail(f"{code} did not resolve after cutover")
              url = item.get("product_url") or ""
              canonical = item.get("canonical_product_code") or item.get("product_code") or ""
              if needle not in url and needle.lower() not in canonical.lower():
                  fail(f"{code} did not alias to {needle}: url={url} canonical={canonical}")
              if "販売終了" in availability(item) or "販売を終了" in availability(item):
                  fail(f"{code} aliased row is discontinued: {availability(item)}")
              print(f"OK alias {code} -> {url} canonical={canonical} price={item.get('price_incl_tax')}")
          PY
